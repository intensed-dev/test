name: Deploy Rebase Feature Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: intensed-dev/code
          ref: feat/rebase-complete
          path: code
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
